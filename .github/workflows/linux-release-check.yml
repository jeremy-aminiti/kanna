name: Linux Release Check

# The Linux release build, its dependency audit, and — under the 2026-09-09
# owner directive — the x86-64 installed-acceptance host.
#
# The directive: the Intel Mac that was to run the native x86-64 Ubuntu 24.04
# acceptance VM is in Japan and unavailable for at least a month, and nothing
# may block on it. The substitute chosen is the `ubuntu-24.04` hosted runner
# itself — genuinely the supported floor's userspace, with a real systemd user
# manager. What it cannot supply is a phone-reachable LAN, a human at a screen,
# and a clean machine (a hosted runner is the opposite of one: it ships with
# Rust, Node and compilers preinstalled), and its kernel is not 6.8. All of
# that is recorded in the support matrix of
# `docs/2026-09-09-linux-phase3-supported-distribution.md`.
#
# **This workflow builds and audits; it does not yet run the installed and
# upgrade acceptance lane.** That lane needs two packages from two source
# revisions to upgrade between, and wiring a second merge-base build has not
# been done or exercised. It is follow-up item 2 in §7 of the evidence doc, and
# the honest state is a build lane that works rather than an acceptance job
# that cannot. Run the lane by hand meanwhile:
# `./kd test linux-installed --old-artifact <deb> --new-artifact <deb>`.
#
# This workflow is deliberately independent of Pages deployment and holds no
# signing or publishing credential. A Linux build failure must never be able to
# block a macOS ship or a schema publish.

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - "packaging/linux/**"
      - "tests/linux-installed/**"
      - "crates/**"
      - "apps/desktop/src-tauri/**"
      - "tools/kd/src/runtime/linux-*.ts"
      - "tools/kd/src/runtime/release-platform.ts"
      - ".github/workflows/linux-release-check.yml"
  push:
    branches:
      - main
    paths:
      - "packaging/linux/**"
      - "tests/linux-installed/**"
      - ".github/workflows/linux-release-check.yml"

# Read-only. This lane builds and tests; it does not publish, and it must not be
# able to.
permissions:
  contents: read

concurrency:
  # Its own group, so a Linux run never queues behind or cancels the Pages
  # deployment.
  group: linux-release-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Both required architectures, each built natively. Cross-compiling the
    # other would leave the linkage — which is what the audit is about —
    # untested on the machine it has to run on.
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            runner: ubuntu-24.04
            zig_platform: x86_64-linux
            zig_sha256: 02aa270f183da276e5b5920b1dac44a63f1a49e55050ebde3aecc9eb82f93239
          - architecture: arm64
            runner: ubuntu-24.04-arm
            zig_platform: aarch64-linux
            zig_sha256: 958ed7d1e00d0ea76590d27666efbf7a932281b3d7ba0c6b01b0ff26498f667f
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # A hosted runner advertises limited storage and a full Rust release
      # build of this workspace is large. Reclaiming the preinstalled toolchains
      # this lane does not use is disposable runner data, never anything the
      # build produces.
      - name: Reclaim runner disk
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Install build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            build-essential pkg-config dpkg-dev

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Record the build host
        run: |
          . /etc/os-release && echo "distribution=$PRETTY_NAME"
          echo "kernel=$(uname -r)"
          echo "glibc=$(getconf GNU_LIBC_VERSION)"
          echo "arch=$(dpkg --print-architecture)"

      - name: Install Zig 0.15.2
        env:
          ZIG_PLATFORM: ${{ matrix.zig_platform }}
          ZIG_SHA256: ${{ matrix.zig_sha256 }}
        run: |
          archive="zig-${ZIG_PLATFORM}-0.15.2.tar.xz"
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/$archive" \
            "https://ziglang.org/download/0.15.2/$archive"
          echo "$ZIG_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict -
          tar --extract --file "$RUNNER_TEMP/$archive" --directory "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-${ZIG_PLATFORM}-0.15.2" >> "$GITHUB_PATH"

      # One package per architecture, from this revision. The installed and
      # upgrade lane needs a second package built from another revision to
      # upgrade between; that is deliberately not wired here yet (see the header).
      - name: Build the candidate package
        run: ./kd build linux-package --channel staging --architecture ${{ matrix.architecture }}

      - uses: actions/upload-artifact@v4
        with:
          name: kanna-linux-${{ matrix.architecture }}
          path: .build/linux-package/out/*.deb
          if-no-files-found: error
          retention-days: 14
